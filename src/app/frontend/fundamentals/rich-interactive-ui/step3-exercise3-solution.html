<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Status Tokens</title>
    <style>
      :root {
        --status-ok: #0f766e;
        --status-warning: #b45309;
        --status-critical: #b91c1c;
        --status-offline: #475569;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 24px;
        font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
        background: #eff4f7;
        color: #13212b;
      }

      .panel {
        max-width: 40rem;
        margin: 0 auto;
        padding: 24px;
        border-radius: 20px;
        background: white;
        box-shadow: 0 18px 40px rgba(19, 33, 43, 0.08);
      }

      .list {
        display: grid;
        gap: 12px;
      }

      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 14px 16px;
        border-radius: 14px;
        background: #f5f8fa;
      }

      .badge {
        padding: 6px 10px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 700;
        color: white;
      }

      .badge[data-status="ok"] {
        background: var(--status-ok);
      }

      .badge[data-status="warning"] {
        background: var(--status-warning);
      }

      .badge[data-status="critical"] {
        background: var(--status-critical);
      }

      .badge[data-status="offline"] {
        background: var(--status-offline);
      }
    </style>
  </head>
  <body>
    <section class="panel">
      <h1>Current line status</h1>
      <div class="list">
        <div class="row">
          <span>Extruder 3</span>
          <span class="badge" data-status="ok">ok</span>
        </div>
        <div class="row">
          <span>Conveyor 14</span>
          <span class="badge" data-status="warning">warning</span>
        </div>
        <div class="row">
          <span>Boiler feed</span>
          <span class="badge" data-status="critical">critical</span>
        </div>
        <div class="row">
          <span>Remote sensor</span>
          <span class="badge" data-status="offline">offline</span>
        </div>
      </div>
    </section>
  </body>
</html>
