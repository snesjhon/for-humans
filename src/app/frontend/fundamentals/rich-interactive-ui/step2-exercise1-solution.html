<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard Shell</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
        background: #e7edf2;
        color: #14202b;
      }

      .app {
        min-height: 100vh;
        padding: 24px;
        display: grid;
        grid-template-columns: 17rem minmax(0, 1fr);
        gap: 24px;
      }

      .sidebar,
      .panel {
        border-radius: 20px;
        background: #f8fbfd;
        box-shadow: 0 18px 40px rgba(20, 32, 43, 0.08);
      }

      .sidebar {
        padding: 24px 20px;
      }

      .sidebar nav {
        display: grid;
        gap: 12px;
        margin-top: 28px;
      }

      .sidebar a {
        padding: 12px 14px;
        border-radius: 12px;
        background: #e7eff5;
        color: inherit;
        text-decoration: none;
      }

      .sidebar a.active {
        background: #14202b;
        color: white;
      }

      .panel {
        padding: 24px;
      }

      .topbar {
        margin-bottom: 24px;
        padding-bottom: 20px;
        border-bottom: 1px solid #d6e0e7;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 24px;
      }

      .eyebrow {
        margin: 0 0 6px;
        font-size: 12px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #5d7284;
      }

      h1 {
        margin: 0;
        font-size: 32px;
      }

      .subcopy {
        margin: 10px 0 0;
        max-width: 44rem;
        color: #536677;
      }

      button {
        border: 0;
        border-radius: 999px;
        padding: 14px 18px;
        background: #0f5d73;
        color: white;
        font-weight: 700;
      }

      .placeholder {
        min-height: 320px;
        border-radius: 16px;
        border: 1px dashed #b3c2cd;
        background:
          linear-gradient(135deg, rgba(15, 93, 115, 0.12), rgba(15, 93, 115, 0)),
          #edf4f8;
      }
    </style>
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <strong>Plant Floor Monitor</strong>
        <nav>
          <a class="active" href="#">Overview</a>
          <a href="#">Devices</a>
          <a href="#">Alarms</a>
        </nav>
      </aside>

      <main class="panel">
        <header class="topbar">
          <div>
            <p class="eyebrow">Morning shift</p>
            <h1>Device board</h1>
            <p class="subcopy">
              Operators need the shell to feel stable while details inside the board change.
            </p>
          </div>
          <button type="button">Refresh snapshot</button>
        </header>

        <section class="placeholder"></section>
      </main>
    </div>
  </body>
</html>
